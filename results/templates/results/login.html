<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Advanced Result Analytics Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        :root { --bg:#0a0f1e; --card:#111827; --border:#1e2d45; --t1:#e2e8f0; --tm:#94a3b8; --a1:#3b82f6; --a2:#8b5cf6; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--t1); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .blob { position:fixed; border-radius:50%; filter:blur(80px); opacity:.15; pointer-events:none; animation:fl 8s ease-in-out infinite; }
        .b1 { width:500px;height:500px;background:#3b82f6;top:-150px;left:-100px; }
        .b2 { width:400px;height:400px;background:#8b5cf6;bottom:-120px;right:-80px;animation-delay:3s; }
        @keyframes fl { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-30px)} }
        .wrapper { position:relative;z-index:10;width:100%;max-width:420px;padding:1rem; }
        .card {
            background:rgba(17,24,39,.9); border:1px solid var(--border); border-radius:24px;
            padding:2.5rem; backdrop-filter:blur(20px);
            box-shadow:0 25px 80px rgba(0,0,0,.5);
            animation:fu .6s ease both;
        }
        @keyframes fu { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
        .logo { display:flex;flex-direction:column;align-items:center;margin-bottom:2rem; }
        .logo-icon { width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:1rem;box-shadow:0 8px 30px rgba(59,130,246,.4); }
        .logo-title { font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
        .logo-sub { font-size:.8rem;color:var(--tm);margin-top:.2rem; }
        .lbl { font-size:.75rem;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem;display:block; }
        .inp {
            background:rgba(255,255,255,.05)!important; border:1px solid var(--border)!important;
            color:var(--t1)!important; border-radius:10px!important; padding:.65rem 1rem .65rem 2.4rem!important;
            font-size:.9rem!important; width:100%;
            transition:border-color .2s,box-shadow .2s!important;
        }
        .inp:focus { border-color:var(--a1)!important; box-shadow:0 0 0 3px rgba(59,130,246,.2)!important; outline:none!important; }
        .inp::placeholder { color:#475569!important; }
        .ig { position:relative; }
        .ig i { position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--tm);font-size:.9rem;z-index:5; }
        .btn-login { width:100%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;color:#fff;font-weight:700;font-size:.95rem;padding:.8rem;border-radius:12px;cursor:pointer;transition:all .2s; }
        .btn-login:hover { opacity:.9;transform:translateY(-1px);box-shadow:0 8px 30px rgba(59,130,246,.45); }
        hr.div { border:none;border-top:1px solid var(--border);margin:1.5rem 0; }
        .slink { text-align:center;font-size:.875rem;color:var(--tm); }
        .slink a { color:var(--a1);font-weight:600;text-decoration:none; }
        .slink a:hover { text-decoration:underline; }
        .alert-err { background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:10px;padding:.75rem 1rem;font-size:.85rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem; }
        .alert-suc { background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#6ee7b7;border-radius:10px;padding:.75rem 1rem;font-size:.85rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem; }
        .roles { display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1.5rem; }
        .rfeat { background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:.6rem .5rem;text-align:center; }
        .rfeat-lbl { font-size:.7rem;color:var(--tm);margin-top:.2rem; }
    </style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="wrapper">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">📊</div>
            <div class="logo-title">Result Analytics Suite</div>
            <div class="logo-sub">Advanced Student Performance Platform</div>
        </div>
        {% for message in messages %}
        <div class="{% if message.tags == 'success' %}alert-suc{% else %}alert-err{% endif %}">
            <i class="bi {% if message.tags == 'success' %}bi-check-circle{% else %}bi-exclamation-circle{% endif %}"></i>
            {{ message }}
        </div>
        {% endfor %}
        <form method="post" id="loginForm" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="lbl" for="id_username">Username</label>
                <div class="ig"><i class="bi bi-person"></i>{{ form.username }}</div>
            </div>
            <div class="mb-4">
                <label class="lbl" for="id_password">Password</label>
                <div class="ig"><i class="bi bi-lock"></i>{{ form.password }}</div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>
        <hr class="div"/>
        <div class="slink">Don't have an account? <a href="/signup/">Create one →</a></div>
        <div class="roles">
            <div class="rfeat"><div style="font-size:1.2rem">🛡️</div><div class="rfeat-lbl">Admin</div></div>
            <div class="rfeat"><div style="font-size:1.2rem">👨‍🏫</div><div class="rfeat-lbl">Teacher</div></div>
            <div class="rfeat"><div style="font-size:1.2rem">🎓</div><div class="rfeat-lbl">Student</div></div>
        </div>
    </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit',function(){
    var b=document.getElementById('loginBtn');
    b.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';
    b.disabled=true;
});
// Fix Django form input classes
document.querySelectorAll('input').forEach(function(el){ el.classList.add('inp'); });
</script>
</body>
</html>
